# Ambiente de desenvolvimento. SQLite é o padrão (sem serviço de banco).
# Para testar outros bancos: docker compose --profile mysql up -d  /  --profile postgres
services:
  app:
    build: ./docker
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: php -S 0.0.0.0:8080 -t public public/index.php

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: pbl4
      MYSQL_DATABASE: pbl4

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: pbl4
      POSTGRES_DB: pbl4

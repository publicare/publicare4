name: Release

# Release AUTOMÁTICA a partir da tag `v*` (ADR 0019, emenda de 2026-11-16): empacotar -> ASSINAR o latest*.json com a chave de USO ->
# CONFERIR a assinatura contra Chaves::USO -> PUBLICAR (zip + manifesto + .sig + instalar.php + instalar.sh, com o SHA-256 dos
# instaladores no resumo da release e no manifesto assinado). Se a conferência falhar, nada é publicado.
# A chave de uso é o segredo PBL4_CHAVE_USO do Environment `release` (aprovação manual obrigatória; tags v* protegidas). Ela só existe
# num arquivo 0600 durante o passo de assinatura e é apagada em seguida. A chave de RECUPERAÇÃO nunca entra no CI.
# Sem o segredo (ensaio/fork): empacota e cria só um RASCUNHO, com aviso no resumo do job; o dono assina com bin/assinar-release.sh
# (contingência, docs/releases.md). Manualmente (workflow_dispatch) é só um ensaio: empacota uma tag existente e não assina nem publica.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente a ensaiar (ex.: v0.1.0). Não publica nada.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  empacotar:
    name: Empacotar (sem assinar; a assinatura é o job seguinte)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.conferir.outputs.versao }}
      canal: ${{ steps.conferir.outputs.canal }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sodium, gd, zip
          coverage: none
          tools: composer:v2
      - name: Conferir a tag, a versão e o CHANGELOG
        id: conferir
        run: |
          .github/scripts/conferir-release.sh "$TAG" . "$RUNNER_TEMP/notas.md" | tee -a "$GITHUB_OUTPUT"
      - name: Preparar a pasta (código da tag + dependências de produção)
        run: |
          mkdir -p "$RUNNER_TEMP/preparada"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/preparada"
          cd "$RUNNER_TEMP/preparada"
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - name: Gerar o instalar.php e conferir o instalar.sh (SHA-256 vai no manifesto, antes de assinar)
        run: |
          mkdir -p "$RUNNER_TEMP/instaladores"
          # o instalar.php de produção é gerado do modelo com as chaves de Pbl\Atualizacao\Chaves (nunca de parâmetro)
          php "$RUNNER_TEMP/preparada/bin/gerar-instalador" --conferir
          php "$RUNNER_TEMP/preparada/bin/gerar-instalador" --saida="$RUNNER_TEMP/instaladores/instalar.php"
          cp "$RUNNER_TEMP/preparada/infra/instalador/instalar.sh" "$RUNNER_TEMP/instaladores/instalar.sh"
          php -l "$RUNNER_TEMP/instaladores/instalar.php"
          sh -n "$RUNNER_TEMP/instaladores/instalar.sh"
          shellcheck -s sh "$RUNNER_TEMP/instaladores/instalar.sh"
      - name: Empacotar (sem assinar aqui)
        env:
          VERSAO: ${{ steps.conferir.outputs.versao }}
          CANAL: ${{ steps.conferir.outputs.canal }}
          SEGURANCA: ${{ steps.conferir.outputs.seguranca }}
          REPO: ${{ github.repository }}
        run: |
          extra=()
          if [ "$SEGURANCA" = "true" ]; then extra+=(--seguranca); fi
          php "$RUNNER_TEMP/preparada/bin/pbl" empacotar "$RUNNER_TEMP/preparada" "$RUNNER_TEMP/saida" \
            --sem-assinar --canal="$CANAL" --url-base-pacote=/pacotes/ \
            --resumo="PBL4 $VERSAO" \
            --notas="https://github.com/$REPO/releases/tag/$TAG" \
            --instaladores="$RUNNER_TEMP/instaladores" \
            "${extra[@]}"
          if [ -e "$RUNNER_TEMP/saida/latest.json.sig" ]; then
            echo "::error::Saiu uma assinatura no CI: a assinatura é só do dono." >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/instaladores/instalar.php" "$RUNNER_TEMP/instaladores/instalar.sh" "$RUNNER_TEMP/saida/"
          php_sha=$(sha256sum "$RUNNER_TEMP/saida/instalar.php" | cut -d ' ' -f 1)
          sh_sha=$(sha256sum "$RUNNER_TEMP/saida/instalar.sh" | cut -d ' ' -f 1)
          {
            cat "$RUNNER_TEMP/notas.md"
            printf '\n### Instaladores (SHA-256)\n\n'
            printf -- '- `instalar.php`: `%s`\n- `instalar.sh`: `%s`\n' "$php_sha" "$sh_sha"
            printf '\nO mesmo valor está no `latest.json` assinado (campo `instaladores`).\n'
          } > "$RUNNER_TEMP/saida/notas.md"
          {
            echo "### Instaladores (SHA-256)"
            echo "- instalar.php: \`$php_sha\`"
            echo "- instalar.sh: \`$sh_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/saida"
      - uses: actions/upload-artifact@v4
        with:
          name: pbl4-release
          path: ${{ runner.temp }}/saida/
          if-no-files-found: error
          retention-days: 7

  assinar:
    name: Assinar e conferir (Environment release)
    # Só tag v* (nunca ensaio manual, nunca branch). O Environment exige aprovação manual antes de o job rodar.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: empacotar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      assinado: ${{ steps.marcar.outputs.assinado || 'false' }}
    env:
      CANAL: ${{ needs.empacotar.outputs.canal }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sodium, gd, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: pbl4-release
          path: ${{ runner.temp }}/saida
      - name: Gravar a chave de uso (arquivo 0600, só para o passo seguinte)
        id: chave
        env:
          CHAVE_USO: ${{ secrets.PBL4_CHAVE_USO }}
        run: |
          if [ -z "$CHAVE_USO" ]; then
            echo "tem_chave=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$CHAVE_USO" > "$RUNNER_TEMP/uso.chave"
          echo "tem_chave=true" >> "$GITHUB_OUTPUT"
      - name: Assinar o manifesto com a chave de uso
        if: steps.chave.outputs.tem_chave == 'true'
        run: |
          nome=latest.json
          if [ "$CANAL" != "estavel" ]; then nome="latest-$CANAL.json"; fi
          php bin/pbl assinar "$RUNNER_TEMP/saida/$nome" --chave-privada="$RUNNER_TEMP/uso.chave" > /dev/null
      - name: Conferir a assinatura contra Chaves::USO
        if: steps.chave.outputs.tem_chave == 'true'
        run: |
          nome=latest.json
          if [ "$CANAL" != "estavel" ]; then nome="latest-$CANAL.json"; fi
          php bin/pbl verificar-assinatura "$RUNNER_TEMP/saida/$nome" --canal="$CANAL"
      - name: Marcar como assinado e conferido
        id: marcar
        if: steps.chave.outputs.tem_chave == 'true'
        run: echo "assinado=true" >> "$GITHUB_OUTPUT"
      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/uso.chave"
      - name: Avisar que não há segredo (ensaio/fork)
        if: steps.chave.outputs.tem_chave == 'false'
        run: |
          echo "::warning::O segredo PBL4_CHAVE_USO não existe neste Environment: a release NÃO será assinada nem publicada; só um rascunho será criado."
      - uses: actions/upload-artifact@v4
        if: steps.marcar.outputs.assinado == 'true'
        with:
          name: pbl4-release-assinado
          path: ${{ runner.temp }}/saida/
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar (ou rascunho, sem segredo)
    # always(): precisa rodar mesmo se `assinar` falhar, para recusar com clareza; só publica com assinado == 'true'.
    if: always() && github.event_name == 'push' && needs.empacotar.result == 'success'
    needs: [empacotar, assinar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSAO: ${{ needs.empacotar.outputs.versao }}
      CANAL: ${{ needs.empacotar.outputs.canal }}
      ASSINAR_RESULTADO: ${{ needs.assinar.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Recusar se a assinatura ou a conferência não passou
        if: needs.assinar.result != 'success'
        run: |
          echo "::error::O job assinar terminou como '$ASSINAR_RESULTADO' (reprovado, falhou ou cancelado): nada foi publicado."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assinar.outputs.assinado == 'true' && 'pbl4-release-assinado' || 'pbl4-release' }}
          path: saida
      - name: Publicar a release assinada e conferida
        if: needs.assinar.outputs.assinado == 'true'
        run: |
          test -s saida/latest*.json.sig || { echo "::error::Sem .sig: não publico."; exit 1; }
          flags=()
          latest=(--latest)
          if [ "$CANAL" = "beta" ]; then flags+=(--prerelease); latest=(); fi
          # rascunho -> sobe o zip e o .sig -> o manifesto por último -> só então publica
          gh release create "$TAG" --draft --verify-tag \
            --title "PBL4 $VERSAO" --notes-file saida/notas.md \
            "${flags[@]}" "saida/pbl4-$VERSAO.zip" saida/instalar.php saida/instalar.sh saida/latest*.json.sig
          gh release upload "$TAG" saida/latest*.json
          gh release edit "$TAG" --draft=false "${latest[@]}"
          echo "### Release $TAG publicada ($CANAL), assinada com a chave de uso e conferida contra Chaves::USO." >> "$GITHUB_STEP_SUMMARY"
      - name: Criar só o rascunho (sem o segredo PBL4_CHAVE_USO)
        if: needs.assinar.outputs.assinado != 'true'
        run: |
          flags=()
          if [ "$CANAL" = "beta" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag \
            --title "PBL4 $VERSAO" --notes-file saida/notas.md \
            "${flags[@]}" \
            "saida/pbl4-$VERSAO.zip" saida/instalar.php saida/instalar.sh saida/latest*.json
          {
            echo "### ATENÇÃO: release NÃO publicada"
            echo "O segredo \`PBL4_CHAVE_USO\` não existe no Environment \`release\` (ensaio ou fork). Foi criado só um RASCUNHO, sem assinatura."
            echo "Para publicar, configure o segredo e empurre a tag de novo, ou assine localmente com \`bin/assinar-release.sh\` (docs/releases.md)."
          } >> "$GITHUB_STEP_SUMMARY"
